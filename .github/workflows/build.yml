name: Build And Save Log

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  APP_NAME: desa-darmasaba
  WA_PHONE: 6289697338821

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Menjalankan PostgreSQL sebagai service di GitHub Actions
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Kirim notifikasi ke API build Start
      - name: Notify start build
        run: |
          curl -X GET "https://wa.wibudev.com/code?text=build-start-desa-darmasaba&nom=${{ env.WA_PHONE }}"

      # Checkout kode sumber
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Konfigurasi environment variable untuk PostgreSQL dan variabel tambahan
      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}?schema=public" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "NEXT_PUBLIC_WIBU_URL=${{ secrets.NEXT_PUBLIC_WIBU_URL }}" >> .env
          echo "WIBU_UPLOAD_DIR=${{ secrets.WIBU_UPLOAD_DIR }}" >> .env

      # create log file
      - name: Create log file
        run: touch build.txt

      # Migrasi database menggunakan Prisma
      - name: Apply Prisma schema to database
        run: bun prisma db push >> build.txt 2>&1

      # Seed database (opsional)
      - name: Seed database
        run: bun prisma db seed >> build.txt 2>&1

      # Build project
      - name: Build project
        run: bun run build >> build.txt 2>&1

        # Generate unique version directory
      - name: Generate version directory
        id: version
        run: echo "VERSION=${{ github.sha }}---v$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      # Ensure project directory exists
      - name: Ensure /var/www/projects/${{ env.APP_NAME }} exists
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/projects/${{ env.APP_NAME }}

      # Deploy to a new version directory
      - name: Deploy to VPS (New Version)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/var/www/projects/${{ env.APP_NAME }}/releases/${{ env.VERSION }}"

      # Kirim file .env ke server
      - name: Upload .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".env"
          target: "/var/www/projects/desa-darmasaba/releases/${{ env.VERSION }}/.env"

      # Kirim notifikasi ke API jika build berhasil
      - name: Notify build success via API
        if: success()
        run: |
          curl -X GET "https://wa.wibudev.com/code?text=finish-success&nom=6289697338821"

      # Kirim notifikasi ke API jika build gagal
      - name: Notify build failed via API
        if: failure()
        run: |
          curl -X GET "https://wa.wibudev.com/code?text=finish-failed&nom=6289697338821"

      # Send email with GitHub Actions logs
      - name: Send email with logs
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "GitHub Actions Logs"
          body: |
            The deployment process has completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}

          to: kurosakiblackangel@gmail.com
          from: bip.production.js@gmail.com
          attachments: |
            build.txt
